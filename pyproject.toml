[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-design"
version = "0.1.0"
description = "Local Python environment for plant regulatory sequence modeling workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bam2bw",
    "bpnet-lite",
    # cherimoya>=0.2.0 requires torch>=2.9 and triton>=3.5.1; bpnet-lite/
    # daicon/tangermeme don't pin torch themselves, so they follow whatever
    # is resolved here. triton has no macOS wheels at all (Linux/CUDA-only
    # compiler toolchain), so cherimoya is Linux-only -- Cherimoya training/
    # benchmarking happens on Linux GPU machines regardless.
    "cherimoya>=0.2.0; sys_platform == 'linux'",
    "daicon",
    "huggingface-hub",
    "joblib",
    "ledidi",
    "leidenalg==0.10.2",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    # 0.2.5's `values()` only supports summary={mean,min,max}; tangermeme's
    # GC-matched negative sampling (extract_matching_loci -> _extract_counts)
    # calls it with summary="sum", which raises ValueError there, gets
    # silently swallowed into NaN for every locus, and empties out the
    # matched-loci result. summary="sum" was added in 0.3.0, which still
    # ships a prebuilt manylinux_2_28 cp312 wheel (no source build needed).
    "pybigtools==0.3.0",
    "pyfaidx",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tangermeme>=1.4.0",
    "torch>=2.9.0; sys_platform == 'linux'",
    "torch; sys_platform != 'linux'",
    "tqdm",
]

[project.optional-dependencies]
hub = ["huggingface-hub"]
# MotifCompendium and personal_bpnet are external/local research dependencies
# until resolvable install sources are confirmed.
# Metaformer / promoterai-torch is still in development and will be added
# when finished.

[dependency-groups]
dev = ["pytest"]
notebook = [
    "ipykernel",
    "jupyterlab",
    # pyzmq 27.1 has no manylinux2014 x86_64 wheel and builds against
    # Sherlock's system libraries. 26.4 provides a compatible CPython 3.12 wheel.
    "pyzmq==26.4.0",
]

[tool.uv]
exclude-dependencies = ["macs3"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools]
# This project uses pyproject.toml as a local environment definition. The
# workflow scripts are run from the repository checkout, not installed as
# importable top-level packages such as bpnet, cherimoya, or preprocess.
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
