[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-design"
version = "0.1.0"
description = "Local Python environment for plant regulatory sequence modeling workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bam2bw",
    "bpnet-lite",
    "daicon",
    "huggingface-hub",
    "joblib",
    "ledidi",
    "leidenalg==0.10.2",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    # Newer pybigtools releases can require source builds that fail on
    # Sherlock's older assembler/toolchain.
    "pybigtools==0.2.5",
    "pyfaidx",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tangermeme>=1.4.0",
    "torch==2.6.0; sys_platform == 'linux'",
    "torch; sys_platform != 'linux'",
    "tqdm",
]

[project.optional-dependencies]
hub = ["huggingface-hub"]
# cherimoya>=0.2.0 requires torch>=2.9, which conflicts with this project's
# pinned torch==2.6.0 (needed by bpnet-lite/daicon/tangermeme). This extra is
# declared for documentation only; `uv sync --extra cherimoya` cannot resolve
# it here. Install cherimoya in a separate environment (e.g. the training
# machine/container) instead.
cherimoya = [
    "cherimoya>=0.2.0",
]
# MotifCompendium and personal_bpnet are external/local research dependencies
# until resolvable install sources are confirmed.
# Metaformer / promoterai-torch is still in development and will be added
# when finished.

[dependency-groups]
dev = ["pytest"]
notebook = [
    "ipykernel",
    "jupyterlab",
    # pyzmq 27.1 has no manylinux2014 x86_64 wheel and builds against
    # Sherlock's system libraries. 26.4 provides a compatible CPython 3.12 wheel.
    "pyzmq==26.4.0",
]

[tool.uv]
exclude-dependencies = ["macs3"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools]
# This project uses pyproject.toml as a local environment definition. The
# workflow scripts are run from the repository checkout, not installed as
# importable top-level packages such as bpnet, cherimoya, or preprocess.
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
